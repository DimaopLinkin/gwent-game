name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  # PR: один прогон на ветку, устаревшие отменяются. Push в dev и main: отдельная группа на каждый коммит,
  # поэтому при быстрых мержах ни один коммит не остаётся без результата CI.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Та же версия, что на Mac пользователя (`.metadata`: Flutter 3.41.0, Dart 3.11.0).
  FLUTTER_VERSION: 3.41.0
  DART_VERSION: 3.11.0

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gwent_engine
            dir: packages/gwent_engine
          - package: gwent_ai
            dir: packages/gwent_ai
          - package: gwent_content
            dir: packages/gwent_content
          - package: gwent_net
            dir: packages/gwent_net
          - package: build_pack
            dir: tools/build_pack
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      # Готовим все пакеты и утилиты: они зависят друг от друга, а сгенерированный код не коммитится.
      - run: tools/scripts/setup.sh packages/* tools/build_pack
        working-directory: .
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tools/scripts/setup.sh
      # Формат и анализ из корня покрывают приложение, packages/ и tools/.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
