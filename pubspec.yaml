name: gwent
description: "Гвинт из «Ведьмака 3» для Android и iOS."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_settings: ^9.0.1
  # Воспроизведение звуковых эффектов (ADR 0023).
  audioplayers: ^6.7.1
  bloc: ^9.2.1
  bonsoir: ^7.1.4
  collection: ^1.19.1
  # Проверка Wi-Fi перед сетевой игрой и переход в системные настройки (ADR 0020).
  connectivity_plus: ^7.3.1
  # SHA-1 для ответа WebSocket-рукопожатия хоста (LanServer): сокет принимается вручную, чтобы ограничить сообщения.
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  # drift и drift_dev закреплены точно и меняются только вместе: drift_dev новее 2.34.0 требует analyzer 13+
  # и meta 1.18, а Flutter 3.41.0 закрепляет meta 1.17.0; drift новее 2.34.0 несовместим с drift_dev 2.34.0.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter_bloc: ^9.1.1
  # Иконки дизайн-системы — SVG-слоты в assets/icons/ (ADR 0009).
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: ^0.20.2
  meta: ^1.17.0
  # Сканер QR-кода гостя: на iOS через Vision без ML Kit, на Android CameraX (ADR 0020).
  mobile_scanner: ^7.4.2
  # Версия приложения для главного меню.
  package_info_plus: ^10.2.2
  # QR-код адреса партии на экране хоста (ADR 0020).
  qr_flutter: ^4.1.0
  # Клиент Supabase для игры через интернет (ADR 0026): чистый Dart, без supabase_flutter и его нативных плагинов.
  supabase: ^2.16.5
  uuid: ^4.5.3

  gwent_ai:
    path: packages/gwent_ai
  gwent_content:
    path: packages/gwent_content
  gwent_engine:
    path: packages/gwent_engine
  gwent_net:
    path: packages/gwent_net

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Для архитектурного теста (разбор import). Версия совместима с drift_dev.
  analyzer: ^10.0.1
  build_runner: ^2.15.1
  drift_dev: 2.34.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  generate: true

  assets:
    # Пакет контента: собирается tools/scripts/setup.sh из docs/hand и не коммитится.
    - assets/content/gwent-w3-base/
    # Арты карт 309×444, имя файла — UUID карты.
    - asset/image/cards/
    # Звуковые эффекты AAC (.m4a), собираются tools/audio/convert_sfx.sh; происхождение и лицензия: tools/audio/README.md.
    - assets/sfx/
    # Фоновая музыка AAC (.m4a), собирается tools/audio/convert_music.sh; происхождение и лицензия: tools/audio/README.md.
    - assets/music/
    # Иконки дизайн-системы: именованные слоты, контракт файла в docs/adr/0009-design-system.md.
    - assets/icons/
    # Лицензии шрифтов (OFL 1.1) для экрана лицензий.
    - assets/fonts/OFL-Alegreya.txt
    - assets/fonts/OFL-CormorantSC.txt

  # Шрифты дизайн-системы (OFL 1.1): статические начертания, подмножество латиница + кириллица.
  fonts:
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alegreya-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Alegreya-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alegreya-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alegreya-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Alegreya-Black.ttf
          weight: 900
    - family: Cormorant SC
      fonts:
        - asset: assets/fonts/CormorantSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantSC-Bold.ttf
          weight: 700
