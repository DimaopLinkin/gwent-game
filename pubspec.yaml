name: gwent
description: "Гвинт из «Ведьмака 3» для Android и iOS."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bloc: ^9.2.1
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  # drift и drift_dev закреплены точно и меняются только вместе: drift_dev новее 2.34.0 требует analyzer 13+
  # и meta 1.18, а Flutter 3.41.0 закрепляет meta 1.17.0; drift новее 2.34.0 несовместим с drift_dev 2.34.0.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  intl: ^0.20.2
  meta: ^1.17.0
  uuid: ^4.5.3

  gwent_content:
    path: packages/gwent_content
  gwent_engine:
    path: packages/gwent_engine

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Для архитектурного теста (разбор import). Версия совместима с drift_dev.
  analyzer: ^10.0.1
  build_runner: ^2.15.1
  drift_dev: 2.34.0


flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # Data assets
    - docs/hand/data/bait_config/bait_config_data.json
    - docs/hand/data/fraction_abilities/fraction_abilities_data.json
    - docs/hand/data/fractions/fractions_data.json
    - docs/hand/data/leader_card_abilities/leader_card_abilities_data.json
    - docs/hand/data/leader_cards/leader_cards_data.json
    - docs/hand/data/mardrem_config/mardrem_config_data.json
    - docs/hand/data/special_card_abilities/special_card_abilities_data.json
    - docs/hand/data/special_cards/special_cards_data.json
    - docs/hand/data/squad_card_abilities/squad_card_abilities_data.json
    - docs/hand/data/squad_cards/squad_cards_data.json
    - docs/hand/data/twin_config/twin_config_data.json
    - docs/hand/data/zones/zones_data.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
